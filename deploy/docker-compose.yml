# Produktion: eine VM in der EU, eine App-Instanz.
#   cd deploy && docker compose up -d --build
# Vorher die Dateien in deploy/secrets/ anlegen (siehe deploy/README.md).
name: kita-ausfall

# Container-Logs begrenzen (Docker rotiert sonst nie)
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN setzen, z. B. kita-ausfall.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      web:
        # feste Adressen: Die App vertraut X-Forwarded-For nur von hier
        ipv4_address: 172.30.0.10
        ipv6_address: fd00:4b17:ae::10
    depends_on: [app]
    logging: *logging

  # Migrationen laufen einmalig mit der Schema-Rolle; die App selbst hat nur DML-Rechte.
  migrate:
    build: ..
    command: ["migrate"]
    restart: "no"
    environment:
      APP_ENV: production
      BASE_URL: https://${DOMAIN}
      SMTP_URL: smtp://unbenutzt
      ALTCHA_HMAC_SECRET_FILE: /run/secrets/altcha_secret
      MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets: [migrate_database_url, altcha_secret]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [db]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  app:
    build: ..
    restart: unless-stopped
    environment:
      APP_ENV: production
      BASE_URL: https://${DOMAIN}
      KONTAKT_EMAIL: ${KONTAKT_EMAIL:?KONTAKT_EMAIL setzen}
      MAIL_FROM: ${MAIL_FROM:-Kita-Ausfall NRW <noreply@${DOMAIN}>}
      VERTRAUTE_DOMAINS: ${VERTRAUTE_DOMAINS:-}
      TRUSTED_PROXY_CIDRS: 172.30.0.10/32,fd00:4b17:ae::10/128
      DATABASE_URL_FILE: /run/secrets/database_url
      ALTCHA_HMAC_SECRET_FILE: /run/secrets/altcha_secret
      SMTP_URL_FILE: /run/secrets/smtp_url
    secrets: [database_url, altcha_secret, smtp_url]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/kita-ausfall", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web, db]
    depends_on:
      migrate: { condition: service_completed_successfully }
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      KITA_MIGRATE_PASSWORD_FILE: /run/secrets/kita_migrate_password
      KITA_APP_PASSWORD_FILE: /run/secrets/kita_app_password
    secrets: [postgres_password, kita_migrate_password, kita_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-kita.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kita"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [db]   # nicht nach außen veröffentlicht
    logging: *logging

networks:
  # IPv6 muss an sein: sonst kommen alle IPv6-Verbindungen mit der Gateway-Adresse
  # an, und alle IPv6-Nutzer:innen teilen sich ein Rate-Limit und einen Melder-Hash.
  # Voraussetzung: Host mit IPv6 und Docker mit ip6tables (Standard ab Docker 27).
  web:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00:4b17:ae::/64
  db:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pgdata:

secrets:
  database_url: { file: ./secrets/database_url }
  migrate_database_url: { file: ./secrets/migrate_database_url }
  altcha_secret: { file: ./secrets/altcha_secret }
  smtp_url: { file: ./secrets/smtp_url }
  postgres_password: { file: ./secrets/postgres_password }
  kita_migrate_password: { file: ./secrets/kita_migrate_password }
  kita_app_password: { file: ./secrets/kita_app_password }
