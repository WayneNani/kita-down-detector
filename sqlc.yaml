version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: { type: time.Time, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: pg_catalog.float8
            nullable: true
            go_type: { type: float64, pointer: true }
          - db_type: pg_catalog.int2
            go_type: int16
